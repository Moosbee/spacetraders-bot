[package]
name = "utils"
version = "0.1.0"
edition = "2024"

[features]
test-support = []

[dependencies]
space_traders_client = { path = "../space_traders_client" }
reqwest = { version = "^0.12", features = ["json", "multipart"] }
tokio = { version = "^1.54", features = ["full"] }
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "^1.0"
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.34"
async-recursion = "1.2.0"
governor = "0.7"
dashmap = { version = "6.2", features = ["raw-api"] }
# tokio + native-tls
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "chrono",
] }
priority-queue = "2.7.0"
rand = "0.8.8"
lazy_static = "1.5.1"
tokio-util = "^0.7"
warp = "0.3.7"
futures = "0.3.34"
tokio-stream = { version = "0.1.19", features = ["sync"] }
serde_with = { version = "3.24.0", features = ["chrono_0_4"] }
rsntp = { version = "4.1.2", features = ["tokio"] }
lockable = "0.1.1"
moka = { version = "0.12.16", features = ["future"] }
thiserror = "2.0.21"
reqwest-middleware = { version = "0.4.2", features = ["json", "multipart"] }
itertools = "0.14.0"
async-graphql = { version = "7.2.1", features = ["chrono"] }
