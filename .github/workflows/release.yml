name: Release

# Build release binaries and publish them to a GitHub prerelease.
# Triggers:
# - push a tag like `v1.2.3`: creates a prerelease and attaches the binaries
# - create a (pre)release manually: attaches the binaries to that release
on:
  push:
    tags:
      - "v*"
  release:
    types:
      - created

permissions:
  contents: write

# Serialize runs for the same tag: the run triggered by our own
# `gh release create` queues behind the tag push and then skips the build.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub prerelease
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1 \
            || gh release create "${{ steps.tag.outputs.tag }}" --prerelease --generate-notes

      - name: Skip if binaries already uploaded
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh release view "${{ steps.tag.outputs.tag }}" --json assets --jq '.assets | length' || echo 0)
          if [[ "$GITHUB_EVENT_NAME" == "release" && "$count" -gt 0 ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and upload (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    env:
      # Ignore the local `--cfg tokio_unstable` rustflag from .cargo/config.toml.
      RUSTFLAGS: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # aarch64-unknown-linux-gnu is cross-compiled from the x86_64 Ubuntu
      # runner. This action installs the aarch64 toolchain and the target's
      # libssl-dev (required by native-tls/sqlx).
      - name: Install cross-compilation tools (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: aarch64-unknown-linux-gnu
          package: libssl-dev
          runner: none

      - name: Install OpenSSL (x86_64 Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libssl-dev pkg-config

      - name: Build and upload binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: spacetraders
          target: ${{ matrix.target }}
          checksum: sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
