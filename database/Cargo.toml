[package]
name = "database"
version = "0.1.0"
edition = "2024"

[dependencies]
space_traders_client = { path = "../space_traders_client" }
utils = { path = "../utils" }
tokio = { version = "^1.54", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "tls-native-tls",
  "postgres",
  "chrono",
] }
chrono = { version = "0.4.45", features = ["serde"] }
itertools = "0.14.0"
thiserror = "2.0.21"
tracing = "0.1.44"
async-graphql = { version = "7.2.1", features = ["chrono", "dataloader"] }
serde_json = "1.0.154"
